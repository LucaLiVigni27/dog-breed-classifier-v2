[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogbreeds"
version = "0.1.0"
description = "Dog breed image classification with transfer learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "imagehash",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "jupyter"]
demo = ["streamlit", "streamlit-paste-button"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
exclude = ["legacy", ".venv", "**/__pycache__"]
ignore = ["legacy"]
