# Reconstruction of v1: small CNN from scratch, 200x200, [0, 1] pixels, RMSprop, no augmentation.
run_name: v1_baseline
model: v1_baseline
pretrained: false
image_size: 200
augment: false
normalize: none
optimizer: rmsprop
lr: 1.0e-4
weight_decay: 0.0
batch_size: 32
epochs: 30
freeze_backbone_epochs: 0
class_weighted_loss: false
label_smoothing: 0.0
early_stopping_patience: 5
seed: 42
num_workers: 2
